name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependency (Pillow)
        run: python -m pip install --upgrade pip pillow

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Smoke-render a tide image
        run: |
          python3 src/python/main.py --now 2026-05-30T14:23 --output /tmp/tide.bmp
          test -f /tmp/tide.bmp
          test -f /tmp/tide.meta

  build-simulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install SDL2
        run: sudo apt-get update && sudo apt-get install -y libsdl2-dev libsdl2-ttf-dev

      - name: Build the SDL simulator
        run: cd build && make clean && PLATFORM=macos make
